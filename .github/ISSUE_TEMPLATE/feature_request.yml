name: Feature request
description: An idea for something Cabinet Go doesn't do yet
labels: ["enhancement"]
body:
  - type: textarea
    id: description
    attributes:
      label: What are you picturing
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why this would help
      description: What's the real problem this solves, if any.
    validations:
      required: false
