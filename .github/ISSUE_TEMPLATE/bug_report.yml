name: Bug report
description: Something in Cabinet Go does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Cabinet Go talks to your own RomM server, so the details below are
        usually what decides whether a problem is reproducible. Please fill
        them in even if they seem irrelevant.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Which system
      description: The handheld the game is for, for example Game Boy Advance, DS, PSP.
      placeholder: Game Boy Advance
    validations:
      required: false

  - type: input
    id: game
    attributes:
      label: Game and file format
      description: Helpful for PSP, where the format (ISO, CSO, CHD) often is the problem.
      placeholder: Pokemon Emerald, .gba
    validations:
      required: false

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "iOS 26.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 15 Pro
    validations:
      required: true

  - type: input
    id: romm-version
    attributes:
      label: RomM server version
      description: Shown in RomM's own web interface.
      placeholder: "5.1.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed Cabinet Go
      options:
        - Sideloaded IPA from Releases
        - TestFlight
        - Built from source
    validations:
      required: true

  - type: checkboxes
    id: offline
    attributes:
      label: Conditions
      options:
        - label: The game was kept on the device for offline play
        - label: It happened while offline or on a bad connection
        - label: A physical controller was connected
