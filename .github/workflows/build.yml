name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build:
    name: Build for device
    # Needs the iOS 26 SDK: the app deploys to iOS 18 but compiles against a
    # few iOS 26 APIs behind availability checks. macos-15 ships Xcode 16 and
    # fails on them.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p

      # For a device, because that is the only build that links the native
      # cores: they are device-only arm64 static libraries, left out of a
      # simulator build. Signing is skipped so this needs no secrets and a
      # fork can run it too. This exists to prove the repository compiles
      # and links from a clean checkout.
      #
      # -target rather than -scheme because the project has no shared schemes,
      # and only the RommApp target ships. LayoutEditor is a dev tool.
      - name: Build
        run: |
          xcodebuild build \
            -project RommApp/RommApp.xcodeproj \
            -target RommApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet
        env:
          NSUnbufferedIO: YES
